<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card with Glow Border -->
  <rect x="2" y="2" width="1196" height="336" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
  </g>

  <!-- Glowing Accent Orbs -->
  <circle cx="1080" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="120" cy="260" r="120" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Top Badge -->
  <g transform="translate(60, 48)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#22c55e"/>
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">TERM ARCHIVE · SEP 2026</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Tools in Data Science (TDS)</text>

  <!-- Subtitle -->
  <text x="60" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Production-Grade Graded Assignment Solutions &amp; System Playbooks</text>

  <!-- Key Tags -->
  <g transform="translate(60, 240)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="36" rx="8" fill="#1e1e2e" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="14" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">⚡ SHELL &amp; CLI</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="130" height="36" rx="8" fill="#1e1e2e" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="156" y="23" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">🚀 FASTAPI &amp; DB</text>

    <!-- Tag 3 -->
    <rect x="284" y="0" width="140" height="36" rx="8" fill="#1e1e2e" stroke="#c084fc" stroke-opacity="0.5"/>
    <text x="298" y="23" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">🧠 LLM PROMPTS</text>

    <!-- Tag 4 -->
    <rect x="436" y="0" width="135" height="36" rx="8" fill="#1e1e2e" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="450" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">📊 VIZ &amp; VERCEL</text>

    <!-- Tag 5 -->
    <rect x="583" y="0" width="220" height="36" rx="8" fill="#1e1e2e" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="597" y="23" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">🔒 EDUCATIONAL USE ONLY</text>
  </g>

  <!-- Author Tag Right -->
  <g transform="translate(940, 240)">
    <rect width="200" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">By <tspan fill="#f1f5f9" font-weight="700">Kartik Chilkoti</tspan></text>
  </g>
</svg>
